org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Máy dev chỉ có 7,3 GB RAM: giữ heap của Gradle daemon và Kotlin daemon nhỏ để không tràn
# bộ nhớ (cấu hình mặc định của Flutter cấp 8 GB cho mỗi daemon).
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
# Kotlin 2.4 + AGP 9.1 trên Windows: biên dịch tăng dần của các module plugin bị lỗi
# "Could not close incremental caches ... is already registered" (KT cache), làm build APK
# thất bại. Tắt incremental compilation để build chạy được; đánh đổi: build lâu hơn khi
# sửa code Kotlin của plugin. Có thể bật lại sau khi Kotlin/AGP được nâng cấp.
kotlin.incremental=false
