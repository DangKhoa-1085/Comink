# LiveKit Server — Cấu hình môi trường phát triển
# Tham khảo: https://docs.livekit.io/home/self-hosting/deployment/
#
# Lưu ý: api_key và api_secret là giá trị dev, dùng chung với backend
# (xem backend/src/Comink.Api/appsettings.Development.json mục LiveKit).
# KHÔNG dùng cấu hình này cho production.

port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882
  # Không dùng IP công cộng khi dev
  use_external_ip: false
  # ⚠️ BẮT BUỘC khi test 2 máy trong LAN: LiveKit chạy trong Docker nên mặc định quảng bá
  # IP container (172.18.x.x) mà máy khác KHÔNG kết nối được. `node_ip` ép LiveKit quảng bá
  # IP LAN của máy host để máy thứ hai vào được phòng.
  node_ip: 192.168.1.42

keys:
  # Khóa dev — LiveKit yêu cầu api_secret dài tối thiểu 32 ký tự; nếu ngắn hơn
  # thì server thoát ngay khi khởi động (ExitCode=1).
  devkey: SyIgXn46XZgezLiVzrNjWBbIdwBgIkGSZuSt4k0AlRBvWkoM

logging:
  level: info
  json: false

# TURN tích hợp sẵn (Giai đoạn 4 — quyết định D2: bật với IP LAN của máy dev).
#
# - `domain` phải là hostname hoặc IP LAN hợp lệ; `localhost` bị LiveKit từ chối.
# - Chỉ bật TURN/UDP (3478). LiveKit BẮT BUỘC có TLS cert nếu bật `tls_port`, nên ở môi
#   trường dev ta để `tls_port: 0` (không cần cert). Muốn TURN/TLS thì phải cấu hình
#   `cert_file`/`key_file` và publish cổng 5349 trong docker-compose.
# - Phạm vi hoạt động: hai máy **cùng LAN** hoặc sau NAT của router (đúng mục 5 roadmap).
#   Gọi giữa hai mạng hoàn toàn khác nhau (ví dụ 4G ↔ Wi-Fi) cần domain công khai hoặc tunnel.
# - Đổi mạng thì phải sửa `domain` ở đây rồi `docker restart comink_livekit`.
turn:
  enabled: true
  domain: 192.168.1.42
  udp_port: 3478
  tls_port: 0
  external_tls: false
  # Dải cổng TURN dùng để relay media. Mặc định LiveKit dùng 30000–40000 (quá rộng để
  # publish trong Docker) → thu hẹp cho dev và publish đúng dải này trong docker-compose.
  relay_range_start: 30500
  relay_range_end: 30510

# Webhook để nhận sự kiện (room bắt đầu/kết thúc, người vào/rời) cho /api/webhooks/livekit.
# host.docker.internal = máy host (từ trong container `localhost` là chính container).
webhook:
  urls:
    - http://host.docker.internal:5117/api/webhooks/livekit
  api_key: devkey
